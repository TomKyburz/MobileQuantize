    <div id="mySidenav" class="sidenav" style="width:0;border:none;">
        <!-- <a href="javascript:void(0)" style="cursor:pointer;" class="closebtn" onclick="closeNav()"><img class="x" src="https://quantize.me/img/xicon.webp"></a> -->
        <a href="quantize/test/index.html">About</a>

    <div class="header">
        <div class="account" style="cursor:pointer;" onclick="toggleNav()">&#9776;</div>
        <h1>GAMES</h1></div>

        <div class="world" id="world"></div>
<div class="gamegrid" id="gamegrid">
</div>

<script src="quantize/js/loadgames.js"></script>

<script>
    function toggleNav() {
      var x = document.getElementById("mySidenav");
      if (x.style.width === "0px") {
        x.style.width = "250px";
        x.style.border = "3px solid white";
      } else if (x.style.width === "250px") {
        x.style.width = "0px";
        x.style.border = "none";
      }
    }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            // Register the Service Worker
            navigator.serviceWorker.register('quantize/sw.js')
                .then(function(registration) {
                    console.log('Service Worker registered with scope:', registration.scope);
                })
                .catch(function(error) {
                    console.error('Service Worker registration failed:', error);
                });
        }
    </script>
    <script src="quantize/js/install.js"></script>
</body>
</html>
